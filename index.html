<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mes Flashcards</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f7f6f2; --surface: #ffffff; --border: #e2e0d8; --border-strong: #c8c5bb;
    --text: #1a1916; --text-muted: #6b6860; --text-faint: #9e9b94;
    --accent: #2d6a4f; --accent-hover: #245a42; --pill-bg: #f0ede6; --danger: #c0392b;
    --radius: 14px; --radius-sm: 8px;
  }
  body { font-family: 'Georgia', serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem 4rem; }
  header { width: 100%; max-width: 560px; display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2rem; }
  h1 { font-size: 22px; font-weight: normal; letter-spacing: -0.3px; }
  #counter { font-family: 'Courier New', monospace; font-size: 13px; color: var(--text-faint); }

  /* API setup */
  #setup { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.5rem; margin-bottom: 1.5rem; }
  #setup p { font-family: sans-serif; font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }
  #setup p a { color: var(--accent); }
  #setup label { font-size: 13px; color: var(--text-muted); display: block; margin-bottom: 6px; font-family: sans-serif; }
  #setup .row { display: flex; gap: 8px; }
  #setup input { flex: 1; font-family: 'Courier New', monospace; font-size: 13px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); outline: none; }
  #setup input:focus { border-color: var(--accent); }
  #setup button { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: sans-serif; font-size: 13px; }
  #setup button:hover { background: var(--accent-hover); }
  #api-status { font-size: 12px; margin-top: 6px; font-family: sans-serif; }
  #api-status.ok { color: var(--accent); } #api-status.err { color: var(--danger); }

  /* Card */
  #card-wrap { width: 100%; max-width: 560px; margin-bottom: 1rem; }
  #card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 2.5rem 2rem; min-height: 280px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: border-color 0.15s, transform 0.12s; user-select: none; }
  #card:hover { border-color: var(--border-strong); transform: translateY(-1px); }
  #card:active { transform: translateY(0); }
  .front { text-align: center; }
  .front .word { font-size: 32px; letter-spacing: -0.5px; margin-bottom: 0.5rem; }
  .front .tap-hint { font-size: 13px; color: var(--text-faint); font-family: sans-serif; font-style: italic; }
  .back { width: 100%; }
  .back .word-sm { font-size: 20px; text-align: center; margin-bottom: 4px; }
  .back .translation { font-size: 13px; color: var(--text-muted); text-align: center; font-family: sans-serif; margin-bottom: 1.25rem; }
  .section-label { font-family: sans-serif; font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 6px; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 1rem 0; }
  .synonym-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 1.25rem; }
  .pill { background: var(--pill-bg); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 13px; font-family: sans-serif; color: var(--text); }
  .examples { display: flex; flex-direction: column; gap: 10px; }
  .example { font-size: 14px; color: var(--text-muted); line-height: 1.65; padding-left: 14px; border-left: 2px solid var(--border-strong); font-family: sans-serif; }
  .spinner-wrap { text-align: center; }
  .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 13px; color: var(--text-faint); font-family: sans-serif; }
  #error-msg { font-size: 13px; color: var(--danger); text-align: center; margin-top: 8px; font-family: sans-serif; min-height: 20px; }

  /* Deck controls */
  .controls { width: 100%; max-width: 560px; display: flex; gap: 10px; margin-bottom: 2rem; }
  .controls button { flex: 1; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; font-family: sans-serif; font-size: 13px; color: var(--text); transition: background 0.12s, border-color 0.12s; }
  .controls button:hover { background: var(--pill-bg); border-color: var(--border-strong); }

  /* Word list panel */
  #list-section { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }

  .list-toolbar { padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .list-title { font-family: sans-serif; font-size: 14px; color: var(--text-muted); white-space: nowrap; margin-right: auto; }
  .list-title strong { color: var(--text); }

  .sort-group { display: flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; flex-shrink: 0; }
  .sort-btn { background: var(--surface); border: none; padding: 5px 11px; font-family: sans-serif; font-size: 12px; color: var(--text-faint); cursor: pointer; transition: background 0.12s, color 0.12s; white-space: nowrap; }
  .sort-btn:not(:last-child) { border-right: 1px solid var(--border); }
  .sort-btn.active { background: var(--accent); color: white; }
  .sort-btn:hover:not(.active) { background: var(--pill-bg); color: var(--text-muted); }

  .toggle-list-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 11px; font-family: sans-serif; font-size: 12px; color: var(--text-faint); cursor: pointer; white-space: nowrap; flex-shrink: 0; }
  .toggle-list-btn:hover { border-color: var(--border-strong); color: var(--text-muted); }

  /* Search + add */
  .search-add-row { display: flex; gap: 8px; padding: 0.9rem 1.25rem; border-bottom: 1px solid var(--border); }
  .search-add-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: 'Georgia', serif; font-size: 14px; background: var(--bg); color: var(--text); outline: none; min-width: 0; }
  .search-add-row input:focus { border-color: var(--accent); }
  .search-add-row input::placeholder { color: var(--text-faint); }
  #search-box { flex: 1.2; font-family: sans-serif; font-size: 13px; }
  .search-add-row button { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); cursor: pointer; font-family: sans-serif; font-size: 13px; white-space: nowrap; flex-shrink: 0; }
  .search-add-row button:hover { background: var(--accent-hover); }

  /* Collapsible body */
  #list-body { overflow: hidden; transition: max-height 0.35s ease, opacity 0.3s ease; }
  #list-body.collapsed { max-height: 0 !important; opacity: 0; }

  /* Word rows */
  #word-rows { }
  .word-row { display: flex; align-items: center; gap: 10px; padding: 8px 1.25rem; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
  .word-row:last-child { border-bottom: none; }
  .word-row:hover { background: var(--bg); }
  .word-num { color: var(--text-faint); font-family: 'Courier New', monospace; font-size: 11px; min-width: 28px; flex-shrink: 0; }
  .word-text { flex: 1; font-family: sans-serif; font-size: 13px; line-height: 1.4; min-width: 0; }
  .word-main { font-weight: 500; color: var(--text); }
  .word-hint { color: var(--text-faint); font-size: 12px; }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 17px; line-height: 1; padding: 2px 5px; border-radius: 4px; flex-shrink: 0; }
  .del-btn:hover { color: var(--danger); background: #fdf0ee; }
  .no-results { padding: 1.25rem; font-family: sans-serif; font-size: 13px; color: var(--text-faint); text-align: center; }

  /* Pagination */
  .pagination { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.25rem; border-top: 1px solid var(--border); gap: 8px; flex-wrap: wrap; }
  .page-info { font-family: sans-serif; font-size: 12px; color: var(--text-faint); }
  .page-btns { display: flex; gap: 6px; align-items: center; }
  .page-size-select { font-family: sans-serif; font-size: 12px; padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface); color: var(--text-muted); cursor: pointer; outline: none; }
  .page-nav { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px 10px; font-family: sans-serif; font-size: 12px; color: var(--text-muted); cursor: pointer; transition: background 0.12s; }
  .page-nav:hover:not(:disabled) { background: var(--pill-bg); border-color: var(--border-strong); }
  .page-nav:disabled { opacity: 0.35; cursor: default; }
  .highlight { background: #fff3b0; border-radius: 2px; }
</style>
</head>
<body>

<header>
  <h1>&#127467;&#127479; Mes flashcards</h1>
  <span id="counter"></span>
</header>

<div id="setup">
  <p>Cle API Groq gratuite &#8594; <a href="https://console.groq.com" target="_blank">console.groq.com</a> (creer un compte &#8594; API Keys &#8594; Create API Key)</p>
  <label>Cle API Groq (stockee localement dans votre navigateur)</label>
  <div class="row">
    <input type="password" id="api-key" placeholder="gsk_..." autocomplete="off" />
    <button onclick="saveKey()">Enregistrer</button>
  </div>
  <div id="api-status"></div>
</div>

<div id="card-wrap">
  <div id="card" onclick="flipCard()">
    <div class="front"><div class="word">&#8212;</div><div class="tap-hint">cliquez pour reveler</div></div>
  </div>
  <div id="error-msg"></div>
</div>

<div class="controls">
  <button onclick="prevCard()">&#8592; Precedent</button>
  <button onclick="shuffleDeck()">&#8644; Melanger</button>
  <button onclick="nextCard()">Suivant &#8594;</button>
</div>

<div id="list-section">
  <div class="list-toolbar">
    <span class="list-title">Mots &nbsp;<strong id="word-count">0</strong></span>
    <div class="sort-group">
      <button class="sort-btn active" id="sort-added" onclick="setSort('added')">Ajoute</button>
      <button class="sort-btn" id="sort-alpha" onclick="setSort('alpha')">A &#8594; Z</button>
    </div>
    <button class="toggle-list-btn" id="toggle-list-btn" onclick="toggleList()">&#9660; Afficher</button>
  </div>

  <div id="list-body" class="collapsed">
    <div class="search-add-row">
      <input type="text" id="search-box" placeholder="Filtrer les mots..." oninput="onSearch()" />
      <input type="text" id="new-word" placeholder="Ajouter: ex. livrer: to deliver" onkeydown="if(event.key==='Enter') addWord()" />
      <button onclick="addWord()">+ Ajouter</button>
    </div>
    <div id="word-rows"></div>
    <div class="pagination">
      <span class="page-info" id="page-info"></span>
      <div class="page-btns">
        <select class="page-size-select" id="page-size" onchange="changePageSize()">
          <option value="25">25 / page</option>
          <option value="50">50 / page</option>
          <option value="100">100 / page</option>
        </select>
        <button class="page-nav" id="btn-prev-page" onclick="changePage(-1)">&#8592; Prec.</button>
        <button class="page-nav" id="btn-next-page" onclick="changePage(1)">Suiv. &#8594;</button>
      </div>
    </div>
  </div>
</div>

<script>
const INITIAL_WORDS = [
  "Dictionnaire",
  "Abordable",
  "Faciliter",
  "Rigueur",
  "Fournir: to provide",
  "Rater: to fail or miss",
  "ca n'a pas de sens",
  "Declencher",
  "Rajouter",
  "Livrer",
  "Je me suis rendu: I went / I realized",
  "Il faut que je teste: I need to test",
  "Point de vue: point of view",
  "La gestion: management / handling",
  "Du coup: so / as a result",
  "Constituer: to constitute / to make up",
  "Contrairement a LTE: unlike LTE",
  "Fichier et dossier: file and folder",
  "Ramener sa fraise: to show up uninvited / to butt in",
  "Souligner: to underline / to highlight",
  "Assigner: to assign",
  "Etablir / il etablit: to establish / he establishes",
  "Par rapport a: compared to / regarding",
  "J'ai note: I noted / I noticed",
  "Je remarque: I notice",
  "Entre guillemets: in quotes",
  "Entre parentheses: in brackets",
  "Je regarde ce qui se passe dans: I look at what is happening in",
  "Gerer: to manage / to handle",
  "Deux par deux, quatre par quatre: two by two, four by four",
  "Est-ce qu'il y a un moyen de mesurer qqch: is there a way to measure sth",
  "Le metro est bonde / surcharge: the metro is packed / overloaded",
  "Obtenir: to obtain / to get",
  "Il obtient: he obtains / he gets",
  "J'ai fait un resume: I made a summary",
  "J'ai vire: I removed / I fired",
  "Virer: to remove / to fire / to transfer",
  "De temps en temps: from time to time",
  "La reponse: the answer / the response",
  "J'ai corrige: I corrected / I fixed",
  "Au niveau de: at the level of / in terms of",
  "Il va falloir: we'll need to / it will be necessary to",
  "Le probleme est regle: the problem is solved",
  "Multiplier les matrices: to multiply the matrices",
  "Je disais que: I was saying that",
  "Decaler: to shift / to offset",
  "Tous les signaux: all the signals",
  "On a pas mal de trucs pour le faire: we have quite a few things to do it",
  "Plusieurs cellules: several cells",
  "Sauf que tu dois faire qqch: except that you have to do sth",
  "C'est ce que je disais: that's what I was saying",
  "C'est a toi: it's your turn / it's yours",
  "Il correspond a: it corresponds to",
  "Explicitement: explicitly",
  "C'est aussi bon: it's just as good",
  "Investigation",
  "Emmerder: to annoy / to bug someone",
  "Ca me fait poser la question: it makes me wonder / raises the question",
  "Dans certaines conditions: under certain conditions",
  "Coherent: consistent / coherent",
  "Confiance en soi: self-confidence",
  "Il m'a parle: he spoke to me",
  "On avait fait: we had done",
  "J'avais fait: I had done",
  "On n'a jamais pu tester: we were never able to test",
  "Ca rajoute un mode: it adds a mode",
  "Ca sert a: it is used for / it serves to",
  "Inferieur: lower / inferior",
  "Superieur: higher / superior",
  "Au debut: at the beginning",
  "A la fin / au bout: at the end",
  "A priori: a priori / in principle",
  "Faible ou fort: weak or strong / low or high",
  "En revanche: on the other hand / however",
  "Traiteur: caterer / deli",
  "Regulierement: regularly",
  "Etend la connectivite: extends connectivity",
  "Le flux protocolaire: the protocol flow",
  "Le defi principal: the main challenge",
  "Exprime: expressed",
  "Les fichiers config qui correspondent a: the config files that correspond to",
  "Resoudre: to solve / to resolve",
  "Cela resout: this solves / this resolves",
  "Activer ou desactiver: to enable or disable",
  "2 par 2 ou 4 par 4: 2 by 2 or 4 by 4",
  "Boucle: loop",
  "Par defaut: by default",
  "Des fois ca marche, des fois ca marche pas: sometimes it works, sometimes it doesn't",
  "Basculer: to tip / to flip / to switch from one state to another",
  "J'ai corrige les bugs: I fixed the bugs",
  "J'ai resolu les erreurs: I resolved the errors",
  "Le probleme est resolu: the problem is resolved",
  "C'est resolu: it's resolved",
  "Depasser: to exceed / to go beyond",
  "Ca ne depasse pas la limite: it doesn't exceed the limit",
  "Ca equilibre le ratio: it balances the ratio",
  "Comportement: behavior",
  "Relacher: to release / to let go",
  "Pleines, occupees: full, busy / occupied",
  "Ca me ralentit / ca me fait ralentir: it slows me down",
  "Le scenario: the scenario",
  "Prendre l'air: to get some fresh air",
  "Concurrent: concurrent / competitor",
  "Aligne: aligned",
  "Le probleme c'est que: the problem is that",
  "Gros/grosse: big (volume / thickness / importance)",
  "Grand/grande: tall / large (overall size)",
  "Long/longue: long (time or physical distance)",
  "Sonnerie: ringtone / ringing",
  "Une puissance constante: a constant power",
  "Si ca a l'air suffisant: if it looks sufficient",
  "J'ai demande a quelqu'un: I asked someone",
  "C'est ce qui m'a occupe: that's what kept me busy",
  "La semaine derniere / la semaine d'avant: last week / the week before",
  "La semaine prochaine / la semaine d'apres: next week / the week after",
  "On a livre aux clients principaux: we delivered to the main clients",
  "Les gens qui veulent: the people who want",
  "Ils font quelque chose: they do something",
  "Ils vont quelque part: they go somewhere",
  "Ils veulent quelque chose: they want something",
  "Des dizaines ou des centaines: tens or hundreds",
  "C'est l'ancien algo: it's the old algorithm",
  "C'est le nouvel algo: it's the new algorithm",
  "Il n'y a qu'un seul: there is only one",
  "Ca me saoule / ca me soule: it's annoying me / it's getting on my nerves",
  "Ca pourrait etre: it could be",
  "Ca m'a surpris: it surprised me",
  "Cramer: to burn / to fry (informal)",
];

let words = [...INITIAL_WORDS];
let order = [];
let cardIdx = 0;
let flipped = false;
let cache = {};
let loading = false;
let listVisible = false;
let sortMode = 'added';
let pageSize = 25;
let currentPage = 0;
let searchQuery = '';
let apiKey = localStorage.getItem('groq_key') || '';

// ── API key ───────────────────────────────────────────────────────────────
function saveKey() {
  const val = document.getElementById('api-key').value.trim();
  if (!val.startsWith('gsk_')) { setStatus('Cle invalide (doit commencer par gsk_...)', false); return; }
  apiKey = val;
  localStorage.setItem('groq_key', val);
  document.getElementById('api-key').value = '';
  setStatus('Cle enregistree', true);
}
function setStatus(msg, ok) {
  const el = document.getElementById('api-status');
  el.textContent = msg; el.className = ok ? 'ok' : 'err';
}
if (apiKey) setStatus('Cle chargee depuis la memoire locale', true);

// ── Deck ──────────────────────────────────────────────────────────────────
function shuffleDeck() {
  order = [...Array(words.length).keys()].sort(() => Math.random() - 0.5);
  cardIdx = 0; flipped = false; showFront();
}
function showFront() {
  flipped = false;
  const word = words[order[cardIdx]];
  document.getElementById('card').innerHTML =
    '<div class="front"><div class="word">' + word + '</div><div class="tap-hint">cliquez pour reveler</div></div>';
  document.getElementById('error-msg').textContent = '';
  document.getElementById('counter').textContent = (cardIdx + 1) + ' / ' + words.length;
}
function prevCard() { if (cardIdx > 0) { cardIdx--; showFront(); } }
function nextCard() { if (cardIdx < order.length - 1) { cardIdx++; showFront(); } }

async function flipCard() {
  if (loading) return;
  if (flipped) { showFront(); return; }
  if (!apiKey) { document.getElementById('error-msg').textContent = 'Entrez votre cle API Groq ci-dessus.'; return; }
  const word = words[order[cardIdx]];
  await lookupWord(word);
}

async function lookupWord(word) {
  if (cache[word]) { showBack(cache[word]); return; }
  loading = true; flipped = true;
  document.getElementById('card').innerHTML = '<div class="spinner-wrap"><div class="spinner"></div><div class="loading-text">Consultation du dictionnaire...</div></div>';
  document.getElementById('error-msg').textContent = '';
  try {
    const resp = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + apiKey },
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant', temperature: 0.4, max_tokens: 600,
        messages: [
          { role: 'system', content: 'You are a French language teacher. Always respond with valid JSON only, no markdown, no explanation.' },
          { role: 'user', content: 'For the French word or phrase: "' + word + '"\nReturn ONLY this JSON:\n{\n  "word": "cleaned word/phrase",\n  "translation": "English translation",\n  "synonyms": ["syn1","syn2","syn3"],\n  "examples": ["Professional context.","Casual context.","Another context."]\n}\nAll synonyms and examples must be in French.' }
        ]
      })
    });
    if (!resp.ok) { const e = await resp.json().catch(()=>({})); throw new Error(e.error?.message || 'HTTP ' + resp.status); }
    const data = await resp.json();
    const parsed = JSON.parse(data.choices[0].message.content.replace(/```json|```/g,'').trim());
    cache[word] = parsed; showBack(parsed);
  } catch(e) {
    document.getElementById('error-msg').textContent = 'Erreur : ' + e.message;
    flipped = false;
    showFront();
  }
  loading = false;
}

function showBack(data) {
  const pills = (data.synonyms||[]).map(s => '<span class="pill">' + s + '</span>').join('');
  const exs = (data.examples||[]).map(e => '<div class="example">' + e + '</div>').join('');
  document.getElementById('card').innerHTML =
    '<div class="back">' +
    '<div class="word-sm">' + (data.word||'') + '</div>' +
    '<div class="translation">' + (data.translation||'') + '</div>' +
    '<hr class="divider">' +
    '<div class="section-label">Synonymes</div>' +
    '<div class="synonym-row">' + (pills || '<span style="font-size:13px;color:#9e9b94;font-family:sans-serif">&#8212;</span>') + '</div>' +
    '<div class="section-label">Exemples</div>' +
    '<div class="examples">' + exs + '</div>' +
    '</div>';
  flipped = true;
}

// ── Word list ─────────────────────────────────────────────────────────────
function onSearch() {
  searchQuery = document.getElementById('search-box').value.toLowerCase();
  currentPage = 0;
  renderWordList();
}

function getDisplayList() {
  let list = words.map((w,i) => ({w, i}));
  if (searchQuery) {
    list = list.filter(({w}) => w.toLowerCase().includes(searchQuery));
  }
  if (sortMode === 'alpha') {
    list.sort((a,b) => a.w.replace(/[^a-zA-Z]/g,'').toLowerCase()
      .localeCompare(b.w.replace(/[^a-zA-Z]/g,'').toLowerCase(), 'fr'));
  }
  return list;
}

function setSort(mode) {
  sortMode = mode; currentPage = 0;
  document.getElementById('sort-added').classList.toggle('active', mode==='added');
  document.getElementById('sort-alpha').classList.toggle('active', mode==='alpha');
  renderWordList();
}

function changePageSize() {
  pageSize = parseInt(document.getElementById('page-size').value);
  currentPage = 0; renderWordList();
}

function changePage(dir) {
  const total = Math.ceil(getDisplayList().length / pageSize);
  currentPage = Math.max(0, Math.min(currentPage + dir, total - 1));
  renderWordList();
}

function highlight(text) {
  if (!searchQuery) return text;
  const re = new RegExp('(' + searchQuery.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + ')', 'gi');
  return text.replace(re, '<span class="highlight">$1</span>');
}

function renderWordList() {
  document.getElementById('word-count').textContent = words.length;
  const list = getDisplayList();
  const totalPages = Math.max(1, Math.ceil(list.length / pageSize));
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  const start = currentPage * pageSize;
  const end = Math.min(start + pageSize, list.length);
  const page = list.slice(start, end);

  if (page.length === 0) {
    document.getElementById('word-rows').innerHTML = '<div class="no-results">Aucun mot trouv&#233;.</div>';
  } else {
    document.getElementById('word-rows').innerHTML = page.map(({w, i}, pi) => {
      const colonIdx = w.indexOf(':');
      const main = colonIdx > -1 ? w.slice(0, colonIdx).trim() : w;
      const hint = colonIdx > -1 ? w.slice(colonIdx + 1).trim() : '';
      return '<div class="word-row" onclick="jumpToWord(' + i + ')" title="Voir la definition">' +
        '<span class="word-num">' + (start + pi + 1) + '</span>' +
        '<span class="word-text"><span class="word-main">' + highlight(main) + '</span>' +
        (hint ? '<span class="word-hint"> &#8212; ' + highlight(hint) + '</span>' : '') +
        '</span>' +
        '<button class="del-btn" onclick="event.stopPropagation();removeWord(' + i + ')" title="Supprimer">&#215;</button>' +
        '</div>';
    }).join('');
  }

  document.getElementById('page-info').textContent =
    list.length === 0 ? '0 mot' : (start+1) + '\u2013' + end + ' sur ' + list.length;
  document.getElementById('btn-prev-page').disabled = currentPage === 0;
  document.getElementById('btn-next-page').disabled = currentPage >= totalPages - 1;

  if (listVisible) resetBodyHeight();
}

function resetBodyHeight() {
  const body = document.getElementById('list-body');
  body.style.maxHeight = 'none';
  requestAnimationFrame(() => { body.style.maxHeight = body.scrollHeight + 'px'; });
}

function toggleList() {
  listVisible = !listVisible;
  const body = document.getElementById('list-body');
  const btn = document.getElementById('toggle-list-btn');
  if (listVisible) {
    body.classList.remove('collapsed');
    body.style.maxHeight = body.scrollHeight + 'px';
    btn.textContent = '\u25b2 Masquer';
  } else {
    body.style.maxHeight = body.scrollHeight + 'px';
    requestAnimationFrame(() => body.classList.add('collapsed'));
    btn.textContent = '\u25bc Afficher';
  }
}

function jumpToWord(realIdx) {
  order = [...Array(words.length).keys()];
  cardIdx = realIdx;
  flipped = false;
  document.getElementById('counter').textContent = (cardIdx+1) + ' / ' + words.length;
  if (apiKey) lookupWord(words[realIdx]);
  else showFront();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function addWord() {
  const input = document.getElementById('new-word');
  const val = input.value.trim();
  if (!val) return;
  words.push(val); input.value = '';
  searchQuery = ''; document.getElementById('search-box').value = '';
  currentPage = Math.floor((words.length - 1) / pageSize);
  renderWordList();
  // Show new word on card and look it up
  order = [...Array(words.length).keys()];
  cardIdx = words.length - 1;
  flipped = false;
  document.getElementById('counter').textContent = (cardIdx+1) + ' / ' + words.length;
  if (apiKey) lookupWord(val);
  else showFront();
}

function removeWord(realIdx) {
  words.splice(realIdx, 1);
  const total = Math.ceil(getDisplayList().length / pageSize);
  if (currentPage >= total) currentPage = Math.max(0, total - 1);
  renderWordList();
  if (words.length) shuffleDeck();
  else {
    document.getElementById('card').innerHTML = '<div class="front"><div class="word">&#8212;</div><div class="tap-hint">Ajoutez des mots ci-dessous</div></div>';
    document.getElementById('counter').textContent = '';
  }
}

renderWordList();
shuffleDeck();
</script>
</body>
</html>
